# ============================================================
# Docker Compose para los servicios de infraestructura.
# Levanta PostgreSQL y pgAdmin 4 para desarrollo local.
# Uso: docker compose up -d
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: finances-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finances}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finances_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-finances}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finances} -d ${POSTGRES_DB:-finances}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finances-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
